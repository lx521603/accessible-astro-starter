name: Deploy Astro to VPS (1Panel)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: 26   # 满足 >= 22.4 要求（或者填 26 保持与本地完全一致）
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Astro project
        run: npm run build

      - name: Deploy dist/ to VPS (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "dist/" 
          TARGET: "/opt/1panel/www/sites/fairy.li/index"
          ARGS: "-avz --delete --exclude=.user.ini"

      - name: Deployment Complete
        run: echo "✅ Astro 静态文件已成功增量覆盖至 1Panel 网站根目录！"